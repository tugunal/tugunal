plugins {
    id "com.android.application"
}

android {
    namespace "com.tugunal.akillimuhasebe"
    compileSdk 35

    defaultConfig {
        applicationId "com.tugunal.akillimuhasebe.stable"
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName "1.2.6"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "missing-release-key.jks")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "akilli-muhasebe-release"
            keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        debug {
            // Development-only build is never distributed and cannot replace the signed app.
            applicationIdSuffix ".internal"
            debuggable true
        }
        release {
            // ONE canonical application ID for all future consumer updates:
            // com.tugunal.akillimuhasebe.stable
            // Never change the app ID or release certificate.
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            debuggable false
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Latin-script text recognition model is bundled for offline invoice-photo OCR.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Embedded document camera; all frames stay on-device.
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
}
