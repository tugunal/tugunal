plugins {
    id "com.android.application"
}

android {
    namespace "com.tugunal.akillimuhasebe"
    compileSdk 35

    defaultConfig {
        applicationId "com.tugunal.akillimuhasebe"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "0.5.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Latin-script text recognition model is bundled for offline invoice-photo OCR.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
