name: Akilli Muhasebe Android APK

on:
  push:
    branches:
      - akilli-muhasebe
      - akilli-muhasebe-v1.2.7-stabilization
  workflow_dispatch:

permissions:
  contents: write

# Prevent obsolete pushes from producing overlapping, potentially stale APK artifacts.
concurrency:
  group: akilli-muhasebe-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Android SDK paketlerini kur
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager bulunamadi: $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle kurulumunu dogrula
        run: |
          if ! command -v gradle >/dev/null 2>&1; then
            echo "Bu runner imajinda Gradle bulunamadi."
            exit 1
          fi
          gradle --version

      - name: Katmanli uygulama JavaScript kontrolu
        run: |
          find app/src/main/assets -name '*.js' -type f -print0 | xargs -0 -n 1 node --check
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          root=Path("app/src/main/assets")
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="script":
                      attributes=dict(attrs)
                      if attributes.get("src"):
                          self.scripts.append(attributes["src"])
          parser=Scripts()
          parser.feed((root/"index.html").read_text(encoding="utf-8"))
          if len(parser.scripts)<11:
              raise SystemExit("Modul eksik: "+repr(parser.scripts))
          for name in parser.scripts:
              path=root/name
              if ".." in Path(name).parts or not path.is_file():
                  raise SystemExit("Modul bulunamadi: "+name)
              print("OK:",name)
          PY

      - name: Banka ve muhasebe islem testleri
        run: node .github/scripts/accounting_smoke_tests.js

      - name: Kullanici adi, Hotmail, telefon ve sifre giris testleri
        run: node .github/scripts/auth_flow_tests.js

      - name: Yerel fiş fatura ve irsaliye tanıma testleri
        run: |
          node --check app/src/main/assets/document_parser.js
          node .github/scripts/document_parser_tests.js

      - name: Android kaynak XML kontrolu
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in [
              "app/src/main/AndroidManifest.xml",
              "app/src/main/res/values/strings.xml",
              "app/src/main/res/values/styles.xml",
              "app/src/main/res/drawable/ic_launcher.xml",
              "app/src/main/res/xml/file_paths.xml",
          ]:
              ET.parse(path)
              print("OK:", path)
          PY

      - name: Surum numarasini oku
        id: version
        run: |
          VERSION="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          if [ -z "$VERSION" ]; then echo "versionName bulunamadi"; exit 1; fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Tek uygulama / tek paket dagitim politikasini test et
        run: python3 .github/scripts/release_policy_tests.py

      - name: Kalici imza anahtarini kontrol et
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Kalici imzalama GitHub Actions secrets icinde bulunamadi. IMZASIZ derleme olusacak; APK olarak dagitilmayacak."
          else
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/akilli-release.jks"
            chmod 600 "$RUNNER_TEMP/akilli-release.jks"
            test -s "$RUNNER_TEMP/akilli-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/akilli-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SADECE resmî kararlı APK'yi derle
        run: |
          gradle --no-daemon clean assembleRelease
          test -d app/build/outputs/apk/release
          test ! -d app/build/outputs/apk/installfix
          test ! -d app/build/outputs/apk/debug

      - name: Kalici imzali APK'nin kimligini ve sertifikasini dogrula
        if: steps.signing.outputs.available == 'true'
        run: |
          mkdir -p dist
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" "dist/AkilliMuhasebe-v${APP_VERSION}.apk"
          TARGET="dist/AkilliMuhasebe-v${APP_VERSION}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$TARGET" > "$RUNNER_TEMP/certificate-check.txt"
          grep -q "2361a76413916f19f0a0ccf5530a0d5213b88c2c2600cf598b49239d7d37adf5" "$RUNNER_TEMP/certificate-check.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$TARGET" | grep -q "^package: name='com.tugunal.akillimuhasebe.stable' versionCode='21' versionName='1.2.6'"
          test "$(find dist -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          echo "OK: Tek uygulama kimligi + kalici imza + tek APK dogrulandi."

      - name: Imza anahtari yoksa YALNIZCA imzasiz derleme girdisini sakla
        if: steps.signing.outputs.available != 'true'
        run: |
          mkdir -p signing-input
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk "signing-input/AkilliMuhasebe-v${APP_VERSION}-UNSIGNED.apk"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-input/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-input/zipalign
          chmod 755 signing-input/zipalign
          echo "::warning::Kurulabilir APK uretilmedi. Her kullaniciya tek paket icin kalici sertifika gereklidir."

      - name: Imzasiz paket girdilerini korumali artifact olarak yukle
        if: steps.signing.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: akilli-muhasebe-v${{ steps.version.outputs.value }}-SIGNING-INPUT-NOT-INSTALLABLE
          path: signing-input/*
          if-no-files-found: error
          retention-days: 7

      - name: SADECE imzali resmî APK'yi yayin artifacti yap
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: akilli-muhasebe-v${{ steps.version.outputs.value }}-SIGNED-STABLE-APK
          path: dist/AkilliMuhasebe-v${{ steps.version.outputs.value }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Tek paketli kararlı sürümü GitHub Releases'a yayımla
        if: steps.signing.outputs.available == 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release:'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Akilli Muhasebe v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          files: dist/AkilliMuhasebe-v${{ steps.version.outputs.value }}.apk
          make_latest: true
          draft: false
          prerelease: false
          body: |
            Bu sürüm yalnızca com.tugunal.akillimuhasebe.stable paketini günceller.
            Farklı eski deneme/kurulum uygulamalarını otomatik kaldıramaz.
            Önce her eski uygulamanın şifreli yedeğini alın ve verilerin taşındığını kontrol edin.
